<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monorepo Dashboard</title>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #14181d;
    --panel-2: #1a1f28;
    --line: #232a35;
    --fg: #eaeff3;
    --muted: #8b949e;
    --accent: #f0b90b;
    --accent-dim: rgba(240,185,11,.14);
    --ok: #3fb950;
    --err: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px; }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .pill {
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    background: var(--accent-dim); border: 1px solid rgba(240,185,11,.35); color: var(--accent);
    font-weight: 600;
  }
  .spacer { flex: 1; }
  .live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(63,185,80,.35); }
  .dot.off { background: var(--err); box-shadow: 0 0 8px rgba(248,81,73,.35); }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin: 14px 0 20px; }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, rgba(240,185,11,.06), transparent 40%);
    pointer-events: none;
  }
  .card b { display: block; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
  .card span { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--fg); }
  .card small { color: var(--muted); font-size: 11px; margin-top: 4px; display: block; }

  .section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px; margin-top: 16px;
  }
  h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
  th { color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: rgba(240,185,11,.03); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #c9d1d9; word-break: break-all; }
  .empty { color: var(--muted); padding: 12px 0; font-size: 13px; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .tag.ok { background: rgba(63,185,80,.12); color: var(--ok); border: 1px solid rgba(63,185,80,.35); }
  .tag.warn { background: rgba(210,153,34,.12); color: var(--warn); border: 1px solid rgba(210,153,34,.35); }
  .tag.err { background: rgba(248,81,73,.12); color: var(--err); border: 1px solid rgba(248,81,73,.35); }

  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: #6e7681; font-size: 12px; text-align: center; }
  a { color: var(--accent); text-decoration: none; }
  .muted { color: var(--muted); }
  .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr 1fr; }
    h1 { font-size: 18px; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Unified Monetization Dashboard</h1>
    <span class="pill" id="status">—</span>
    <div class="spacer"></div>
    <div class="live">
      <span class="dot" id="dot"></span>
      <span id="ts">—</span>
    </div>
  </header>

  <!-- Lumen Chain -->
  <div class="section">
    <h2>Lumen Chain</h2>
    <div class="grid" id="lumen-cards"></div>
    <div id="lumen-detail" class="empty">Нет данных</div>
  </div>

  <!-- Perps Funding Pulse -->
  <div class="section">
    <h2>Perps Funding Pulse</h2>
    <div class="grid" id="perps-cards"></div>
    <div id="perps-detail" class="empty">Нет данных</div>
  </div>

  <!-- Agent X402 -->
  <div class="section">
    <h2>Agent X402</h2>
    <div class="grid" id="agent-cards"></div>
    <div id="agent-detail" class="empty">Нет данных</div>
  </div>

  <!-- Wallet Hygiene -->
  <div class="section">
    <h2>Wallet Hygiene</h2>
    <div class="grid" id="wallet-cards"></div>
    <div id="wallet-detail" class="empty">Нет данных</div>
  </div>

  <footer>
    Unified Monetization Dashboard · <a href="/api/aggregated">JSON API</a>
  </footer>
</div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtNum = (n) => {
  if (n == null) return "—"
  const v = Number(n)
  if (Number.isInteger(v) && Math.abs(v) < 1e6) return v.toLocaleString("ru-RU")
  return v.toLocaleString("ru-RU", { maximumFractionDigits: 2 })
}

async function load() {
  try {
    const r = await fetch("/api/aggregated", { cache: "no-store" })
    if (!r.ok) throw new Error("not ok")
    const data = await r.json()
    document.getElementById("status").textContent = "Live"
    document.getElementById("dot").classList.remove("off")
    document.getElementById("ts").textContent = "обновлено " + new Date(data.ts).toLocaleTimeString("ru")
    renderProject(data.projects["lumen-chain"], "lumen", ["blocks","supply","validators","staked"], [
      ["Блоки", "blocks"], ["Эмиссия", "supply"], ["Валидаторы", "validators"], ["Стейк", "staked"]
    ])
    renderProject(data.projects["perps-funding-pulse"], "perps", ["requests","revenue","volume"], [
      ["Запросы", "requests"], ["Выручка (USDC)", "revenue"], ["Объём", "volume"]
    ])
    renderProject(data.projects["agent-x402"], "agent", ["requests","revenue"], [
      ["Запросы", "requests"], ["Выручка (USDC)", "revenue"]
    ])
    renderProject(data.projects["wallet-hygiene"], "wallet", ["scans","keysFound"], [
      ["Сканы", "scans"], ["Найдено ключей", "keysFound"]
    ])
  } catch (e) {
    document.getElementById("status").textContent = "Ошибка"
    document.getElementById("dot").classList.add("off")
    document.getElementById("ts").textContent = "нет данных"
  }
}

function renderProject(proj, id, keys, labels) {
  if (!proj || !proj.ts) return
  const cards = document.getElementById(id + "-cards")
  const detail = document.getElementById(id + "-detail")
  cards.innerHTML = labels.map(([label, key]) => {
    const value = proj[key]
    const display = Array.isArray(value) ? value.length + " записей" : fmtNum(value)
    return `<div class="card"><b>${esc(label)}</b><span>${esc(display)}</span><small>${new Date(proj.ts).toLocaleTimeString("ru")}</small></div>`
  }).join("")
  detail.innerHTML = `<span class="tag ok">Обновлено ${new Date(proj.ts).toLocaleString("ru")}</span>`
}

load()
setInterval(load, 15000)
</script>
</body>
</html>
